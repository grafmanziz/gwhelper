name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          ls -la
          ZIP=$(ls gw*.zip | sort -V | tail -n 1)
          test -n "$ZIP" || { echo "НЕТ gw*.zip В КОРНЕ РЕПОЗИТОРИЯ"; exit 1; }
          echo "Собираю из $ZIP"
          unzip -o "$ZIP" -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: proj
      - uses: actions/upload-artifact@v4
        with:
          name: gw-helper-v3-${{ github.run_number }}
          path: proj/app/build/outputs/apk/debug/app-debug.apk
